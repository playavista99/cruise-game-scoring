<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="app-version" content="2.4">
<title>All Ashore Game Scoring</title>
<meta name="description" content="Score cruise ship deck games on one phone or tablet: Quick Score, Bracket, and Round Robin tournaments. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#135a8c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topzone topzone-left" aria-hidden="true"></div>
  <div class="topzone topzone-center">
    <button class="brand" id="brandBtn" aria-label="Home">
      <span class="brand-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 64 64"><g stroke-linecap="round"><g stroke="#ffcc55" stroke-width="4.5"><line x1="32" y1="11" x2="32" y2="4"/><line x1="32" y1="53" x2="32" y2="60"/><line x1="11" y1="32" x2="4" y2="32"/><line x1="53" y1="32" x2="60" y2="32"/><line x1="17.15" y1="17.15" x2="12.2" y2="12.2"/><line x1="46.85" y1="17.15" x2="51.8" y2="12.2"/><line x1="17.15" y1="46.85" x2="12.2" y2="51.8"/><line x1="46.85" y1="46.85" x2="51.8" y2="51.8"/></g><g stroke="#ffffff" stroke-width="3"><line x1="32" y1="14" x2="32" y2="50"/><line x1="14" y1="32" x2="50" y2="32"/><line x1="19.3" y1="19.3" x2="44.7" y2="44.7"/><line x1="44.7" y1="19.3" x2="19.3" y2="44.7"/></g><circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="32" cy="32" r="5" fill="#ffffff"/></g></svg></span><span class="brand-name">All Ashore · Game Scoring</span>
    </button>
  </div>
  <div class="topbtns">
    <button class="topbtn" id="accountBtn">Account</button>
    <button class="topbtn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
  </div>
  <nav class="menupanel hidden" id="menuPanel" aria-label="App menu">
    <button class="menuitem" id="menuHomeBtn" type="button"><span class="menuitem-ic" aria-hidden="true">🏠</span><span>Home</span></button>
    <button class="menuitem" id="menuInstallBtn" type="button"><span class="menuitem-ic" aria-hidden="true">📲</span><span>Install this app</span></button>
    <button class="menuitem" id="menuShareBtn" type="button"><span class="menuitem-ic" aria-hidden="true">🔗</span><span>Share / QR code</span></button>
    <a class="menuitem hidden" id="menuWhatsappBtn" href="#" target="_blank" rel="noopener"><span class="menuitem-ic" aria-hidden="true">💬</span><span>Join the WhatsApp group</span></a>
    <a class="menuitem" id="menuAllAshoreBtn" href="https://allashore.app" target="_blank" rel="noopener"><span class="menuitem-ic" aria-hidden="true">🌊</span><span>All Ashore — cruise weather &amp; port guides</span></a>
    <button class="menuitem" id="menuFeedbackBtn" type="button"><span class="menuitem-ic" aria-hidden="true">✉️</span><span>Send feedback</span></button>
    <div class="menuversion" id="menuVersionSection">
      <div id="menuVersionText">Version 2.4</div>
      <div class="menuversion-status" id="updateStatus" role="status" aria-live="polite"></div>
      <button class="menuversion-btn" id="checkUpdatesBtn" type="button">Check for updates</button>
      <button class="menuversion-btn update hidden" id="updateNowBtn" type="button">⬆ Update now</button>
    </div>
  </nav>
</header>
<main id="app" class="app"></main>
<div id="modalRoot"></div>
<script src="config.js"></script>
<script src="engines.js"></script>
<script src="qr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
